#version mismatch between openssl-libs,openssl-server alredy present in VM so we are upgrading to latest openssl other packages also upgraded.
- name: upgrade open ssl packages
  ansible.builtin.dnf:
    name:
  state: latest
  loop:
   - openssl
   - openssl-libs
   - openssh
   - openssh-server   
   - openssh-clients
       
