#   loop:
#     - openssl
#     - openssl-libs
#     - openssh
#     - openssh-server
#     - openssh-clients
- name: upgrade openssl and ssh packages
  ansible.builtin.dnf:
    name:
      - openssl
      - openssl-libs
      - openssh
      - openssh-server
      - openssh-clients
    state: latest

- name: restart ssh service
  ansible.builtin.service:
    name: sshd
    state: restarted
       
- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: python.yaml

- name: system setup
  ansible.builtin.import_role:
    name: common
    tasks_from: system-setup.yaml